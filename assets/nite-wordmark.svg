<svg viewBox="0 0 880 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nite Framework">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A2050"/>
      <stop offset="1" stop-color="#0A0D24"/>
    </linearGradient>
    <linearGradient id="dots" gradientUnits="userSpaceOnUse" x1="0" y1="95" x2="0" y2="225">
      <stop offset="0" stop-color="#F2F4FF"/>
      <stop offset="1" stop-color="#8B9AF8"/>
    </linearGradient>
    <linearGradient id="stem" gradientUnits="userSpaceOnUse" x1="139" y1="95" x2="241" y2="225">
      <stop offset="0" stop-color="#B7C1FF"/>
      <stop offset="1" stop-color="#6D7FF0"/>
    </linearGradient>
  </defs>

  <!-- badge: Midnight triple-dot column + N mark -->
  <g>
    <rect width="320" height="320" rx="70" fill="url(#bg)"/>
    <rect x="66" y="95" width="27.5" height="27.5" rx="6.25" fill="url(#dots)"/>
    <rect x="66" y="146.25" width="27.5" height="27.5" rx="6.25" fill="url(#dots)"/>
    <rect x="66" y="197.5" width="27.5" height="27.5" rx="6.25" fill="url(#dots)"/>
    <line x1="139" y1="95" x2="139" y2="225" stroke="url(#stem)" stroke-width="27.5" stroke-linecap="round"/>
    <line x1="241" y1="95" x2="241" y2="225" stroke="url(#stem)" stroke-width="27.5" stroke-linecap="round"/>
    <line x1="139" y1="95" x2="241" y2="225" stroke="url(#stem)" stroke-width="27.5" stroke-linecap="round"/>
  </g>

  <text x="380" y="196" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', sans-serif"
        font-size="150" font-weight="700" letter-spacing="-4" fill="#EEF1FF">nite</text>
  <text x="380" y="262" font-family="'Ubuntu', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="52" font-weight="500" letter-spacing="14" fill="#7C8CF8">FRAMEWORK</text>
</svg>
