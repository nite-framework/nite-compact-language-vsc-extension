<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nite logo: Midnight triple-dot column beside an N lettermark">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A2050"/>
      <stop offset="1" stop-color="#0A0D24"/>
    </linearGradient>
    <linearGradient id="dots" gradientUnits="userSpaceOnUse" x1="0" y1="152" x2="0" y2="360">
      <stop offset="0" stop-color="#F2F4FF"/>
      <stop offset="1" stop-color="#8B9AF8"/>
    </linearGradient>
    <linearGradient id="stem" gradientUnits="userSpaceOnUse" x1="222" y1="152" x2="386" y2="360">
      <stop offset="0" stop-color="#B7C1FF"/>
      <stop offset="1" stop-color="#6D7FF0"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Midnight triple-dot column -->
  <rect x="106" y="152" width="44" height="44" rx="10" fill="url(#dots)"/>
  <rect x="106" y="234" width="44" height="44" rx="10" fill="url(#dots)"/>
  <rect x="106" y="316" width="44" height="44" rx="10" fill="url(#dots)"/>

  <!-- N lettermark -->
  <line x1="222" y1="152" x2="222" y2="360" stroke="url(#stem)" stroke-width="44" stroke-linecap="round"/>
  <line x1="386" y1="152" x2="386" y2="360" stroke="url(#stem)" stroke-width="44" stroke-linecap="round"/>
  <line x1="222" y1="152" x2="386" y2="360" stroke="url(#stem)" stroke-width="44" stroke-linecap="round"/>
</svg>
